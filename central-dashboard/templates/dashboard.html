<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('browser_title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">VoltWise</span>
            <span class="brand-sub">Central</span>
        </div>
        <div class="toolbar">
            <div class="lang-switch" role="navigation" aria-label="Language">
                <a href="{{ url_for('set_language', code='en') }}" class="lang-link{% if lang == 'en' %} active{% endif %}">{{ t('nav.lang_en') }}</a>
                <span class="lang-sep">|</span>
                <a href="{{ url_for('set_language', code='de') }}" class="lang-link{% if lang == 'de' %} active{% endif %}">{{ t('nav.lang_de') }}</a>
            </div>
            <button type="button" class="btn btn-primary" id="btn-scan">{{ t('nav.scan') }}</button>
            <button type="button" class="btn btn-danger" id="btn-record">{{ t('nav.record_start') }}</button>
        </div>
    </header>

    <p id="loading" class="loading hidden" role="status">{{ t('loading.scanning') }}</p>

    <div id="grid" class="grid"></div>

    <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true"></div>
    <div id="modal" class="modal hidden" role="dialog" aria-labelledby="modal-title">
        <h2 id="modal-title">{{ t('modal.recording_title') }}</h2>
        <p class="muted">{{ t('modal.recording_hint') }}</p>
        <input type="text" id="modal-input" placeholder="{{ t('modal.placeholder') }}" autocomplete="off">
        <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="modal-cancel">{{ t('modal.cancel') }}</button>
            <button type="button" class="btn btn-primary" id="modal-ok">{{ t('modal.start') }}</button>
        </div>
    </div>

    <div id="upd-modal-backdrop" class="modal-backdrop hidden" aria-hidden="true"></div>
    <div id="upd-modal" class="modal hidden" role="dialog" aria-labelledby="upd-modal-title">
        <h2 id="upd-modal-title">{{ t('upd.title') }}</h2>
        <p class="muted">
            {{ t('upd.lead') }} <span id="upd-inst"></span> · {{ t('upd.latest') }}
            <span id="upd-new"></span>
        </p>
        <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="upd-later">{{ t('upd.later') }}</button>
            <a class="btn btn-primary" id="upd-open-release" href="#" target="_blank" rel="noopener">{{ t('upd.open_release') }}</a>
            <a class="btn btn-primary hidden" id="upd-dl" href="#" target="_blank" rel="noopener">{{ t('upd.download') }}</a>
        </div>
    </div>

    <script>
        window.VW_CENTRAL = {{ vw_central | tojson }};
    </script>
    <script>
        const C = window.VW_CENTRAL || {};
        let isRecording = false;
        let modalResolve = null;

        function showModal(title, placeholder, initial) {
            document.getElementById('modal-title').textContent = title;
            const inp = document.getElementById('modal-input');
            inp.placeholder = placeholder || '';
            inp.value = initial || '';
            document.getElementById('modal-backdrop').classList.remove('hidden');
            document.getElementById('modal').classList.remove('hidden');
            inp.focus();
            return new Promise((resolve) => { modalResolve = resolve; });
        }

        function hideModal(val) {
            document.getElementById('modal-backdrop').classList.add('hidden');
            document.getElementById('modal').classList.add('hidden');
            if (modalResolve) modalResolve(val);
            modalResolve = null;
        }

        document.getElementById('modal-cancel').onclick = () => hideModal(null);
        document.getElementById('modal-ok').onclick = () => {
            hideModal(document.getElementById('modal-input').value.trim());
        };
        document.getElementById('modal-backdrop').onclick = () => hideModal(null);

        function fmtSeen(ts) {
            if (ts == null || ts === '') return '—';
            const sec = Math.floor(Date.now() / 1000 - ts);
            if (sec < 45) return C.seen_just_now || 'just now';
            if (sec < 3600) return Math.floor(sec / 60) + ' ' + (C.seen_min_ago || 'min ago');
            return Math.floor(sec / 3600) + ' ' + (C.seen_h_ago || 'h ago');
        }

        let livePollId = null;

        function clearLivePoll() {
            if (livePollId != null) {
                clearInterval(livePollId);
                livePollId = null;
            }
        }

        function fmtVal(v, unit) {
            if (v == null || v === '') return '—';
            return String(v) + (unit || '');
        }

        function buildLiveContent(d) {
            const root = document.createElement('div');
            root.className = 'live-inner';
            if (d.simulation) {
                const sim = document.createElement('p');
                sim.className = 'sim-banner';
                sim.textContent = C.live_sim_banner || '';
                root.appendChild(sim);
            }
            const sensors = d.sensors || {};
            const addrs = Object.keys(sensors)
                .map((k) => Number(k))
                .sort((a, b) => a - b);
            const grid = document.createElement('div');
            grid.className = 'phase-grid';
            for (const addr of addrs) {
                const s = sensors[addr];
                const card = document.createElement('div');
                card.className = 'phase-card';
                const h = document.createElement('h4');
                h.textContent = (C.live_sensor_heading || 'Sensor') + ' ' + addr;
                card.appendChild(h);
                if (!s) {
                    const p = document.createElement('p');
                    p.className = 'muted';
                    p.textContent = C.live_no_data || '';
                    card.appendChild(p);
                    grid.appendChild(card);
                    continue;
                }
                const dl = document.createElement('dl');
                dl.className = 'metric-dl';
                const rows = [
                    [C.live_voltage, fmtVal(s.voltage, ' V')],
                    [C.live_current, fmtVal(s.current, ' A')],
                    [C.live_power, fmtVal(s.power, ' W')],
                    [C.live_energy, fmtVal(s.energy, ' Wh')],
                    [C.live_frequency, fmtVal(s.frequency, ' Hz')],
                    [C.live_pf, fmtVal(s.pf, '')],
                ];
                rows.forEach(([label, val]) => {
                    const row = document.createElement('div');
                    const dt = document.createElement('dt');
                    dt.textContent = label;
                    const dd = document.createElement('dd');
                    dd.textContent = val;
                    row.appendChild(dt);
                    row.appendChild(dd);
                    dl.appendChild(row);
                });
                card.appendChild(dl);
                grid.appendChild(card);
            }
            root.appendChild(grid);
            if (
                d.neutral_current != null &&
                d.neutral_current !== '' &&
                addrs.length === 3
            ) {
                const nr = document.createElement('div');
                nr.className = 'neutral-row';
                nr.innerHTML =
                    '<span>' +
                    (C.live_neutral || '') +
                    '</span><span>' +
                    Number(d.neutral_current).toFixed(3) +
                    ' A</span>';
                root.appendChild(nr);
            }
            return root;
        }

        async function refreshLiveData() {
            const cards = document.querySelectorAll('.card[data-node-ip]');
            for (const card of cards) {
                const ip = card.getAttribute('data-node-ip');
                const liveEl = card.querySelector('.node-live');
                if (!liveEl) continue;
                const online =
                    card.getAttribute('data-node-online') === '1';
                if (!online) {
                    liveEl.innerHTML =
                        '<p class="live-offline">' +
                        (C.live_offline || '') +
                        '</p>';
                    continue;
                }
                try {
                    const r = await fetch(
                        '/api/proxy/' +
                            encodeURIComponent(ip) +
                            '/api/data',
                        { cache: 'no-store' }
                    );
                    const j = await r.json();
                    if (j.error) throw new Error(j.error);
                    liveEl.innerHTML = '';
                    liveEl.appendChild(buildLiveContent(j));
                } catch (e) {
                    liveEl.innerHTML =
                        '<p class="live-error">' +
                        (C.live_error || '') +
                        '</p>';
                }
            }
        }

        async function loadNodes() {
            const res = await fetch('/api/nodes');
            const nodes = await res.json();
            renderGrid(nodes);
        }

        async function discoverNodes() {
            const scanning = C.loading_scanning || '…';
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('loading').textContent = scanning;
            try {
                const res = await fetch('/api/discover', { method: 'POST' });
                const data = await res.json();
                const tpl = C.discover_found || 'Found {count}.';
                document.getElementById('loading').textContent = tpl.replace(
                    /\{count\}/g,
                    String(data.count)
                );
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('loading').textContent = scanning;
                }, 2000);
                loadNodes();
            } catch (e) {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('btn-record');
            const startLab = C.nav_record_start || '';
            const stopLab = C.nav_record_stop || '';
            if (!isRecording) {
                const name = await showModal(
                    C.modal_recording_title || '',
                    C.modal_placeholder || '',
                    C.modal_event_default || ''
                );
                if (!name) return;
                await fetch('/api/recording/start_all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                isRecording = true;
                btn.textContent = stopLab;
                btn.classList.remove('btn-danger');
                btn.classList.add('btn-muted');
            } else {
                await fetch('/api/recording/stop_all', { method: 'POST' });
                isRecording = false;
                btn.textContent = startLab;
                btn.classList.add('btn-danger');
                btn.classList.remove('btn-muted');
            }
        }

        async function saveLabel(ip, label) {
            await fetch('/api/nodes/' + encodeURIComponent(ip) + '/label', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ label })
            });
            loadNodes();
        }

        function renderGrid(nodes) {
            clearLivePoll();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.classList.toggle('grid-multi', nodes.length > 1);
            const ipPrefix = (C.grid_ip || 'IP') + ' ';
            const lastSeen = C.grid_last_seen || '';
            const liveMsg = C.live_loading || '';
            const ph = C.grid_display_placeholder || '';
            const saveLab = C.grid_save || '';
            const fullUi = C.grid_full_ui || '';
            nodes.forEach((node) => {
                const title = node.node_label || node.hostname || node.ip;
                const online = node.status === 'online';
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-node-ip', node.ip);
                card.setAttribute('data-node-online', online ? '1' : '0');
                card.innerHTML = `
                    <div class="card-head">
                        <h3 class="card-title"></h3>
                        <span class="pill pill-${node.status || 'offline'}"></span>
                    </div>
                    <p class="meta">${ipPrefix}${node.ip}</p>
                    <p class="meta subtle">${lastSeen} <span class="seen"></span></p>
                    <div class="node-live"><p class="muted live-loading-msg">${liveMsg}</p></div>
                    <div class="card-actions">
                        <input type="text" class="label-input" placeholder="${ph.replace(/"/g, '&quot;')}" aria-label="${ph.replace(/"/g, '&quot;')}">
                        <button type="button" class="btn btn-ghost btn-sm save-label">${saveLab}</button>
                        <a class="btn btn-primary btn-sm" href="http://${node.ip}:25500/" target="_blank" rel="noopener">${fullUi}</a>
                    </div>`;
                card.querySelector('.card-title').textContent = title;
                card.querySelector('.seen').textContent = fmtSeen(node.last_seen);
                const inp = card.querySelector('.label-input');
                inp.value = node.node_label || '';
                card.querySelector('.save-label').onclick = () =>
                    saveLabel(node.ip, inp.value.trim());
                grid.appendChild(card);
            });
            refreshLiveData();
            if (nodes.length > 0) {
                livePollId = setInterval(refreshLiveData, 2000);
            }
        }

        document.getElementById('btn-scan').onclick = discoverNodes;
        document.getElementById('btn-record').onclick = toggleRecording;
        loadNodes();
        setInterval(loadNodes, 35000);

        async function checkAppUpdate() {
            try {
                const r = await fetch('/api/app/update-status');
                const d = await r.json();
                if (!d.update_available || !d.html_url) return;
                document.getElementById('upd-inst').textContent = d.current;
                document.getElementById('upd-new').textContent =
                    d.latest_tag || d.latest_version || '';
                document.getElementById('upd-open-release').href = d.html_url;
                const dlb = document.getElementById('upd-dl');
                if (d.recommended_download_url) {
                    dlb.href = d.recommended_download_url;
                    dlb.classList.remove('hidden');
                } else {
                    dlb.classList.add('hidden');
                }
                document.getElementById('upd-modal-backdrop').classList.remove('hidden');
                document.getElementById('upd-modal').classList.remove('hidden');
                document.getElementById('upd-later').onclick = () => {
                    document.getElementById('upd-modal-backdrop').classList.add('hidden');
                    document.getElementById('upd-modal').classList.add('hidden');
                };
                document.getElementById('upd-modal-backdrop').onclick = (ev) => {
                    if (ev.target.id === 'upd-modal-backdrop') {
                        document.getElementById('upd-later').click();
                    }
                };
            } catch (e) {
                /* offline / GitHub unreachable */
            }
        }
        checkAppUpdate();
    </script>
</body>
</html>
