<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltWise Central</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">VoltWise</span>
            <span class="brand-sub">Central</span>
        </div>
        <div class="toolbar">
            <button type="button" class="btn btn-primary" id="btn-scan">Scan network</button>
            <button type="button" class="btn btn-danger" id="btn-record">Start recording all</button>
        </div>
    </header>

    <p id="loading" class="loading hidden" role="status">Scanning…</p>

    <div id="grid" class="grid"></div>

    <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true"></div>
    <div id="modal" class="modal hidden" role="dialog" aria-labelledby="modal-title">
        <h2 id="modal-title">Recording name</h2>
        <p class="muted">This event name is sent to every VoltWise Node.</p>
        <input type="text" id="modal-input" placeholder="Event name" autocomplete="off">
        <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
            <button type="button" class="btn btn-primary" id="modal-ok">Start</button>
        </div>
    </div>

    <div id="upd-modal-backdrop" class="modal-backdrop hidden" aria-hidden="true"></div>
    <div id="upd-modal" class="modal hidden" role="dialog" aria-labelledby="upd-modal-title">
        <h2 id="upd-modal-title">Update available</h2>
        <p class="muted">
            Installed: <span id="upd-inst"></span> · Latest:
            <span id="upd-new"></span>
        </p>
        <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="upd-later">Later</button>
            <a class="btn btn-primary" id="upd-open-release" href="#" target="_blank" rel="noopener">Open release page</a>
            <a class="btn btn-primary hidden" id="upd-dl" href="#" target="_blank" rel="noopener">Download installer</a>
        </div>
    </div>

    <script>
        let isRecording = false;
        let modalResolve = null;

        function showModal(title, placeholder, initial) {
            document.getElementById('modal-title').textContent = title;
            const inp = document.getElementById('modal-input');
            inp.placeholder = placeholder || '';
            inp.value = initial || '';
            document.getElementById('modal-backdrop').classList.remove('hidden');
            document.getElementById('modal').classList.remove('hidden');
            inp.focus();
            return new Promise((resolve) => { modalResolve = resolve; });
        }

        function hideModal(val) {
            document.getElementById('modal-backdrop').classList.add('hidden');
            document.getElementById('modal').classList.add('hidden');
            if (modalResolve) modalResolve(val);
            modalResolve = null;
        }

        document.getElementById('modal-cancel').onclick = () => hideModal(null);
        document.getElementById('modal-ok').onclick = () => {
            hideModal(document.getElementById('modal-input').value.trim());
        };
        document.getElementById('modal-backdrop').onclick = () => hideModal(null);

        function fmtSeen(ts) {
            if (ts == null || ts === '') return '—';
            const sec = Math.floor(Date.now() / 1000 - ts);
            if (sec < 45) return 'just now';
            if (sec < 3600) return Math.floor(sec / 60) + ' min ago';
            return Math.floor(sec / 3600) + ' h ago';
        }

        let livePollId = null;

        function clearLivePoll() {
            if (livePollId != null) {
                clearInterval(livePollId);
                livePollId = null;
            }
        }

        function fmtVal(v, unit) {
            if (v == null || v === '') return '—';
            return String(v) + (unit || '');
        }

        function buildLiveContent(d) {
            const root = document.createElement('div');
            root.className = 'live-inner';
            if (d.simulation) {
                const sim = document.createElement('p');
                sim.className = 'sim-banner';
                sim.textContent =
                    'Demo / simulation — synthetic readings, not live PZEM hardware.';
                root.appendChild(sim);
            }
            const sensors = d.sensors || {};
            const addrs = Object.keys(sensors)
                .map((k) => Number(k))
                .sort((a, b) => a - b);
            const grid = document.createElement('div');
            grid.className = 'phase-grid';
            for (const addr of addrs) {
                const s = sensors[addr];
                const card = document.createElement('div');
                card.className = 'phase-card';
                const h = document.createElement('h4');
                h.textContent = 'Sensor / Phase · Addr ' + addr;
                card.appendChild(h);
                if (!s) {
                    const p = document.createElement('p');
                    p.className = 'muted';
                    p.textContent = 'No data';
                    card.appendChild(p);
                    grid.appendChild(card);
                    continue;
                }
                const dl = document.createElement('dl');
                dl.className = 'metric-dl';
                const rows = [
                    ['Voltage', fmtVal(s.voltage, ' V')],
                    ['Current', fmtVal(s.current, ' A')],
                    ['Power', fmtVal(s.power, ' W')],
                    ['Energy', fmtVal(s.energy, ' Wh')],
                    ['Frequency', fmtVal(s.frequency, ' Hz')],
                    ['Power factor', fmtVal(s.pf, '')],
                ];
                rows.forEach(([label, val]) => {
                    const row = document.createElement('div');
                    const dt = document.createElement('dt');
                    dt.textContent = label;
                    const dd = document.createElement('dd');
                    dd.textContent = val;
                    row.appendChild(dt);
                    row.appendChild(dd);
                    dl.appendChild(row);
                });
                card.appendChild(dl);
                grid.appendChild(card);
            }
            root.appendChild(grid);
            if (
                d.neutral_current != null &&
                d.neutral_current !== '' &&
                addrs.length === 3
            ) {
                const nr = document.createElement('div');
                nr.className = 'neutral-row';
                nr.innerHTML =
                    '<span>Neutral current (calc.)</span><span>' +
                    Number(d.neutral_current).toFixed(3) +
                    ' A</span>';
                root.appendChild(nr);
            }
            return root;
        }

        async function refreshLiveData() {
            const cards = document.querySelectorAll('.card[data-node-ip]');
            for (const card of cards) {
                const ip = card.getAttribute('data-node-ip');
                const liveEl = card.querySelector('.node-live');
                if (!liveEl) continue;
                const online =
                    card.getAttribute('data-node-online') === '1';
                if (!online) {
                    liveEl.innerHTML =
                        '<p class="live-offline">Node offline — no live data.</p>';
                    continue;
                }
                try {
                    const r = await fetch(
                        '/api/proxy/' +
                            encodeURIComponent(ip) +
                            '/api/data',
                        { cache: 'no-store' }
                    );
                    const j = await r.json();
                    if (j.error) throw new Error(j.error);
                    liveEl.innerHTML = '';
                    liveEl.appendChild(buildLiveContent(j));
                } catch (e) {
                    liveEl.innerHTML =
                        '<p class="live-error">Could not load readings ( network or node ).</p>';
                }
            }
        }

        async function loadNodes() {
            const res = await fetch('/api/nodes');
            const nodes = await res.json();
            renderGrid(nodes);
        }

        async function discoverNodes() {
            document.getElementById('loading').classList.remove('hidden');
            try {
                const res = await fetch('/api/discover', { method: 'POST' });
                const data = await res.json();
                document.getElementById('loading').textContent =
                    'Found ' + data.count + ' VoltWise Node(s).';
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('loading').textContent = 'Scanning…';
                }, 2000);
                loadNodes();
            } catch (e) {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('btn-record');
            if (!isRecording) {
                const name = await showModal(
                    'Recording name',
                    'Central event',
                    'Central event'
                );
                if (!name) return;
                await fetch('/api/recording/start_all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                isRecording = true;
                btn.textContent = 'Stop recording all';
                btn.classList.remove('btn-danger');
                btn.classList.add('btn-muted');
            } else {
                await fetch('/api/recording/stop_all', { method: 'POST' });
                isRecording = false;
                btn.textContent = 'Start recording all';
                btn.classList.add('btn-danger');
                btn.classList.remove('btn-muted');
            }
        }

        async function saveLabel(ip, label) {
            await fetch('/api/nodes/' + encodeURIComponent(ip) + '/label', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ label })
            });
            loadNodes();
        }

        function renderGrid(nodes) {
            clearLivePoll();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.classList.toggle('grid-multi', nodes.length > 1);
            nodes.forEach((node) => {
                const title = node.node_label || node.hostname || node.ip;
                const online = node.status === 'online';
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-node-ip', node.ip);
                card.setAttribute('data-node-online', online ? '1' : '0');
                card.innerHTML = `
                    <div class="card-head">
                        <h3 class="card-title"></h3>
                        <span class="pill pill-${node.status || 'offline'}"></span>
                    </div>
                    <p class="meta">IP ${node.ip}</p>
                    <p class="meta subtle">Last seen: <span class="seen"></span></p>
                    <div class="node-live"><p class="muted live-loading-msg">Loading readings…</p></div>
                    <div class="card-actions">
                        <input type="text" class="label-input" placeholder="Display name" aria-label="Display name">
                        <button type="button" class="btn btn-ghost btn-sm save-label">Save</button>
                        <a class="btn btn-primary btn-sm" href="http://${node.ip}:25500/" target="_blank" rel="noopener">Full node UI</a>
                    </div>`;
                card.querySelector('.card-title').textContent = title;
                card.querySelector('.seen').textContent = fmtSeen(node.last_seen);
                const inp = card.querySelector('.label-input');
                inp.value = node.node_label || '';
                card.querySelector('.save-label').onclick = () =>
                    saveLabel(node.ip, inp.value.trim());
                grid.appendChild(card);
            });
            refreshLiveData();
            if (nodes.length > 0) {
                livePollId = setInterval(refreshLiveData, 2000);
            }
        }

        document.getElementById('btn-scan').onclick = discoverNodes;
        document.getElementById('btn-record').onclick = toggleRecording;
        loadNodes();
        setInterval(loadNodes, 35000);

        async function checkAppUpdate() {
            try {
                const r = await fetch('/api/app/update-status');
                const d = await r.json();
                if (!d.update_available || !d.html_url) return;
                document.getElementById('upd-inst').textContent = d.current;
                document.getElementById('upd-new').textContent =
                    d.latest_tag || d.latest_version || '';
                document.getElementById('upd-open-release').href = d.html_url;
                const dlb = document.getElementById('upd-dl');
                if (d.recommended_download_url) {
                    dlb.href = d.recommended_download_url;
                    dlb.classList.remove('hidden');
                } else {
                    dlb.classList.add('hidden');
                }
                document.getElementById('upd-modal-backdrop').classList.remove('hidden');
                document.getElementById('upd-modal').classList.remove('hidden');
                document.getElementById('upd-later').onclick = () => {
                    document.getElementById('upd-modal-backdrop').classList.add('hidden');
                    document.getElementById('upd-modal').classList.add('hidden');
                };
                document.getElementById('upd-modal-backdrop').onclick = (ev) => {
                    if (ev.target.id === 'upd-modal-backdrop') {
                        document.getElementById('upd-later').click();
                    }
                };
            } catch (e) {
                /* offline / GitHub unreachable */
            }
        }
        checkAppUpdate();
    </script>
</body>
</html>
