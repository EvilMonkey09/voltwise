# Builds the flashable Raspberry Pi OS image (losetup on the Ubuntu runner — no Docker).
# Publishes:
#   - GitHub Actions artifact: voltwise-node-sd-image (*.xz)
#   - On push to tag v*: attaches *.xz to a Release (creates release if missing)

name: Build SD image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VOLTWISE_IMAGE_CACHE: ${{ github.workspace }}/.cache/voltwise-image-cache

jobs:
  sd-image:
    name: Build VoltWise SD image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RPI_OS_IMG_URL: ${{ vars.RPI_OS_IMG_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Raspberry Pi OS download
        uses: actions/cache@v4
        with:
          path: ${{ env.VOLTWISE_IMAGE_CACHE }}
          key: raspios-arm64-${{ runner.os }}-v2-${{ hashFiles('tools/image-build/docker-build-inner.sh') }}
          restore-keys: |
            raspios-arm64-${{ runner.os }}-v2-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils curl wget fdisk dosfstools coreutils util-linux file

      - name: Build SD image (native losetup)
        env:
          SOURCE_DIR: ${{ github.workspace }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
          CACHE_DIR: ${{ env.VOLTWISE_IMAGE_CACHE }}
          COMPRESS: "1"
        run: |
          mkdir -p dist "$VOLTWISE_IMAGE_CACHE"
          sudo chmod +x tools/image-build/docker-build-inner.sh
          sudo -E bash tools/image-build/docker-build-inner.sh

      - name: List outputs
        run: ls -lah dist/

      - name: Upload artifact (.xz — flash this with Raspberry Pi Imager)
        uses: actions/upload-artifact@v4
        with:
          name: voltwise-node-sd-image
          path: dist/*.xz
          if-no-files-found: error
          retention-days: 21

      - name: Attach to GitHub Release (tags v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.xz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
