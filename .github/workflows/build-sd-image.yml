# Builds only the Node SD image (artifact). Does not attach to a Release.
# Production SD images for end users: GitHub Releases only (workflow "Release (Node SD + Central)" on tag v*).
# Demo builds here are short-lived testing artifacts — never published as release assets.

name: Build SD image

on:
  workflow_dispatch:
    inputs:
      demo_image:
        description: "Nur für Tests — synthetische Daten, kein PZEM (nicht unter Releases; Artifact läuft schnell ab)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  VOLTWISE_IMAGE_CACHE: ${{ github.workspace }}/.cache/voltwise-image-cache

jobs:
  sd-image:
    name: Build VoltWise SD image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RPI_OS_IMG_URL: ${{ vars.RPI_OS_IMG_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Raspberry Pi OS download
        uses: actions/cache@v4
        with:
          path: ${{ env.VOLTWISE_IMAGE_CACHE }}
          key: raspios-arm64-${{ runner.os }}-v2-${{ hashFiles('tools/image-build/docker-build-inner.sh') }}
          restore-keys: |
            raspios-arm64-${{ runner.os }}-v2-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils curl wget fdisk dosfstools coreutils util-linux file

      - name: Build SD image (native losetup)
        env:
          SOURCE_DIR: ${{ github.workspace }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
          CACHE_DIR: ${{ env.VOLTWISE_IMAGE_CACHE }}
          COMPRESS: "1"
          VOLTWISE_DEMO_IMAGE: ${{ inputs.demo_image && '1' || '' }}
        run: |
          mkdir -p dist "$VOLTWISE_IMAGE_CACHE"
          sudo chmod +x tools/image-build/docker-build-inner.sh
          sudo -E bash tools/image-build/docker-build-inner.sh

      - name: List outputs
        run: ls -lah dist/

      - name: Upload artifact (production SD image)
        if: ${{ inputs.demo_image == false }}
        uses: actions/upload-artifact@v4
        with:
          name: voltwise-node-sd-image
          path: dist/*.xz
          if-no-files-found: error
          retention-days: 21

      - name: Upload artifact (DEMO — testing only, not a release download)
        if: ${{ inputs.demo_image == true }}
        uses: actions/upload-artifact@v4
        with:
          name: voltwise-node-DEMO-testing-only-not-for-users-sd-image
          path: dist/*.xz
          if-no-files-found: error
          retention-days: 3
